name: Verify MigrationProof
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/build_fixtures.py
      - run: git diff --exit-code -- fixtures/
      - run: python -m unittest discover -s tests -v
      - run: genvm-lint check contracts/migration_proof.py --json
      - run: genvm-lint schema contracts/migration_proof.py --json
